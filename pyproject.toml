[project]
name = "solo-cell-kit"
version = "0.1.0"
description = "Make a Solo Empire cell (its own API, database, platform write path and deploy) from a cell.yaml"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "fastapi>=0.115,<1",
    "pyjwt[crypto]>=2.10,<3",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pgserver>=0.1.4"]

[project.scripts]
cellkit-new = "cellkit.new:main"
cellkit-import = "cellkit.importer:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cellkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
